spring:
  application:
    name: palpita-ae-api

  datasource:
    url: jdbc:postgresql://localhost:5432/palpita_ae_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

